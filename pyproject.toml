[project]
name = "open-intent-router"
version = "0.1.0"
description = "A lightweight, pluggable intent router and Agent orchestration backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
memory = [
    "mem0ai>=0.1.100",
    "pymilvus>=2.4.0",
    "milvus-lite>=2.4.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
ci = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]
audit = [
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",
    "E501",
]

[tool.setuptools.packages.find]
include = ["app*", "host_adapters*", "host_apps*"]
exclude = ["docs*", "openspec*", "tests*"]
