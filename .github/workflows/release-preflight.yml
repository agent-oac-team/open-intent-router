name: Release Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-integration:
    name: postgresql-integration-preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_USER: oir
          POSTGRES_PASSWORD: oir-ci-only
          POSTGRES_DB: oir_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OIR_TEST_POSTGRESQL_URL: postgresql+asyncpg://oir:oir-ci-only@127.0.0.1:5432/oir_preflight
      OIR_CLEANUP_TEST_DATABASE_URL: postgresql+asyncpg://oir:oir-ci-only@127.0.0.1:5432/oir_preflight
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked backend CI dependencies
        run: uv sync --locked --extra ci

      - name: Run isolated PostgreSQL integration tests
        run: |
          uv run --locked --extra ci python -m pytest -q \
            tests/test_cleanup_oir_knowledge_postgres.py \
            tests/test_memory_postgresql_integration.py \
            tests/test_registry_atomic_mutation.py \
            tests/test_plan_cancellation_truth.py
