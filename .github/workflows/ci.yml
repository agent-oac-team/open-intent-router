name: CI Regression Gate

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    name: backend-regression
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      STORAGE_BACKEND: memory
      REGISTRY_BACKEND: file
      ROUTER_LLM_PROVIDER: mock
      DATABASE_URL: sqlite+aiosqlite:///./data/open-intent-router-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install backend CI dependencies
        run: uv sync --locked --extra ci

      - name: Run backend tests
        run: uv run --locked --extra ci python -m pytest

  python-static-checks:
    name: python-static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install backend CI dependencies
        run: uv sync --locked --extra ci

      - name: Run ruff lint
        run: uv run --locked --extra ci ruff check .

      - name: Run ruff format check
        run: uv run --locked --extra ci ruff format --check .

      - name: Validate Host Adapter boundary
        run: uv run --locked --extra ci python scripts/validate_host_adapter_boundaries.py

      - name: Validate frozen IRS contract snapshots
        run: uv run --locked --extra ci python scripts/build_oac_irs_contract_index.py --check

  frontend-regression:
    name: frontend-regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run frontend production build
        run: npm run build

  openspec-validation:
    name: openspec-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Validate changed OpenSpec changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            change_output="$(python scripts/list_changed_openspec_changes.py --all-active)"
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi

            change_output="$(
              python scripts/list_changed_openspec_changes.py --base "$base" --head "$head"
            )"
          fi

          if [[ -z "$change_output" ]]; then
            echo "No active OpenSpec change directories need validation."
            exit 0
          fi

          while IFS= read -r change_name; do
            echo "Validating OpenSpec change: ${change_name}"
            openspec validate "$change_name" --strict
          done <<< "$change_output"
