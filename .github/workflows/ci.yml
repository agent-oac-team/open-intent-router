name: CI Regression Gate

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    name: backend-regression
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      STORAGE_BACKEND: memory
      REGISTRY_BACKEND: file
      ROUTER_LLM_PROVIDER: mock
      DATABASE_URL: sqlite+aiosqlite:///./data/open-intent-router-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]"

      - name: Run backend tests
        run: python -m pytest

  python-static-checks:
    name: python-static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]"

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Validate Host Adapter boundary
        run: python scripts/validate_host_adapter_boundaries.py

      - name: Validate frozen IRS contract snapshots
        run: python scripts/build_oac_irs_contract_index.py --check

  frontend-regression:
    name: frontend-regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run frontend production build
        run: npm run build

  openspec-validation:
    name: openspec-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Validate changed OpenSpec changes
        shell: bash
        run: |
          set -euo pipefail

          declare -A changes=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            while IFS= read -r change_dir; do
              change_name="$(basename "$change_dir")"
              changes["$change_name"]=1
            done < <(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive)
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi

            while IFS= read -r path; do
              [[ "$path" == openspec/changes/archive/* ]] && continue
              change_name="${path#openspec/changes/}"
              change_name="${change_name%%/*}"
              [[ -n "$change_name" ]] && changes["$change_name"]=1
            done < <(git diff --name-only "$base" "$head" -- "openspec/changes")
          fi

          if (( ${#changes[@]} == 0 )); then
            echo "No active OpenSpec change directories need validation."
            exit 0
          fi

          for change_name in "${!changes[@]}"; do
            echo "Validating OpenSpec change: ${change_name}"
            openspec validate "$change_name" --strict
          done
