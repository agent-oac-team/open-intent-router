name: Automated Inspection

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependency-audit:
    name: backend-dependency-audit-advisory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[audit]"

      - name: Audit Python dependencies
        run: pip-audit --local

  frontend-dependency-audit:
    name: frontend-dependency-audit-advisory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  dependency-freshness:
    name: dependency-freshness-advisory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Report outdated Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci,audit]"
          python -m pip list --outdated --format=columns || true

      - name: Report outdated frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm outdated || true

  performance-baseline-placeholder:
    name: performance-baseline-placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reserve performance baseline inspection path
        run: |
          if [ -d tests/performance ] || [ -d benchmarks ]; then
            echo "Performance benchmark directory exists. Add benchmark commands here before making this check required."
          else
            echo "No lightweight performance baseline suite is defined yet."
          fi
